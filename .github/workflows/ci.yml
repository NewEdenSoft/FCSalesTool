name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build FCSalesTool.slnx --configuration Release

      # The AppHost tests only build the Aspire model; no containers (Docker) are started.
      - name: Test
        run: >
          dotnet test --solution FCSalesTool.slnx --configuration Release --no-build
          --report-xunit-markdown --report-xunit-trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          dir="${{ runner.temp }}/test-results"
          echo "## .NET tests" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "$dir/*.md" > /dev/null; then
            for f in "$dir"/*.md; do
              sed 's/^### Test Results/### Test assembly/' "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No test results were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
